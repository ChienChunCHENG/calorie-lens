name: Web lens (GitHub Pages)

# Publishes web/ to https://<owner>.github.io/<repo>/ . GitHub Pages cannot send COOP/COEP headers, so the page is
# not cross-origin isolated: onnxruntime-web falls back to 1 wasm thread (see web/src/detector.ts). That is fine
# for the 320 px detector; use Cloudflare Pages (web/public/_headers) if threads are ever needed.
on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "core/ts/**"
      - "data/nutrition.json"
      - "ml/labels.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build -- --base=/${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
