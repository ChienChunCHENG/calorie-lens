      range 330-380). Raw 豬大排 I0304201 = 214 (n=1), 豬小排 I0304301 = 287 (n=3) bracket the cut range (max reflects fattier cuts). Cooking yield
      0.78 and coating share 15% are assumptions. For bone-in chops, portions must be on edible weight.
    source:
    - TFDA I0304201
    - TFDA I0304301
    - TFDA B0420101 (甘藷粉 as coating)
    - cook-yield and coating assumptions
