      water uptake) 38% by weight (146 kcal/100g, range 120-175); broth with oil layer (豬骨湯 ~8 kcal + beef fat/oil/soy sauce, assumed) 50% by
      weight (25 kcal/100g, range 12-45); braised beef (牛後腿腱子心 I0108301 139 raw /0.7 yield, with allowance for fattier 牛腩) 12% by weight (220
      kcal/100g, range 160-300). Typical bowl ~650-700 g; fractions are assumptions (the broth share and broth oil are the main uncertainty).
