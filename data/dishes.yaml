# Generated from the TFDA pivot plus composition assumptions. See data/README.md.
schema_note: kcal_100g is per 100 g of the dish as served (cooked, edible portion) and EXCLUDES cooking-oil uptake for fried/stir-fried dishes
  (oil.yaml adder supplies it). min/typ/max = 90% interval.
dishes:
  rice_white:
    zh: 白飯
    en: Steamed white rice
    kind: solid
    origin: direct
    kcal_100g:
      min: 140
      typ: 183
      max: 200
    macros_100g:
      p: 3.1
      f: 0.3
      c: 41.0
    tfda_refs:
    - A0550601
    method_notes: 'COOKED rice (not raw). TFDA A0550601: rice cooked in a rice cooker with 1.1x water, n=1, so no sd. typ = TFDA value 183. Max
      = typ +9%. Min deliberately lowered to 140 (below the generic -15% = 155): shops usually cook with 1.2-1.3x water and the 食物代換表 gives about
      70 kcal per 1/4 bowl (~50 g) of cooked rice = ~140 kcal/100 g. TFDA R1100101 免煮飯 (retort rice pack) = 168 is a second reference. Typ may
      run high for shop rice.'
    source:
    - TFDA A0550601 白飯
    - TFDA R1100101 免煮飯 (cross-check)
    - 衛福部/國健署 食物代換表 (recalled from memory, about 70 kcal per 50 g cooked rice; verify)
    confidence: med
  lu_rou_fan:
    zh: 滷肉飯
    en: Braised pork rice
    kind: solid
    origin: composed
    kcal_100g:
      min: 172.0
      typ: 225.8
      max: 250.0
    macros_100g:
      p: 4.4
      f: 7.9
      c: 33.6
    tfda_refs:
    - A0550601
    - P1000301
    method_notes: Composed, 1 item (do not segment). 白飯 cooked rice (A0550601) 80% by weight (183 kcal/100g, range 140-200); 肉燥/滷肉 incl. sauce
      (P1000301 肉燥) 20% by weight (397 kcal/100g, range 300-450). Weight fractions are an assumption (about 200 g rice + 50 g braised pork with
      sauce for a small bowl); TFDA P1000301 肉燥 is a single n=1 sample of a packaged minced-pork topping and is only a proxy for shop 滷肉 (belly
      pork + skin; fattier shops higher). Min/max = component ranges combined with fully correlated weights (conservative). Braised, so any added-oil
      adder should be ~0.
    source:
    - TFDA A0550601
    - TFDA P1000301
    - composition assumption
    confidence: low
    components:
    - name: 白飯 cooked rice (A0550601)
      frac: 0.8
      kcal: 183
      kmin: 140
      kmax: 200
      p: 3.1
      f: 0.3
      c: 41.0
      ref: A0550601
    - name: 肉燥/滷肉 incl. sauce (P1000301 肉燥)
      frac: 0.2
      kcal: 397
      kmin: 300
      kmax: 450
      p: 9.5
      f: 38.1
      c: 4.2
      ref: P1000301
  chicken_leg:
    zh: 雞腿
    en: Chicken drumstick (fried or braised)
    kind: solid
    origin: composed
    kcal_100g:  # AS-SERVED incl. bone = edible 185/232/285 x edible fraction 0.70/0.80/1.00 (QC)
      min: 130
      typ: 186
      max: 285
    macros_100g:  # as-served, edible macros x 0.80
      p: 16.6
      f: 13.1
      c: 0.5
    tfda_refs:
    - I0404102
    - I0404302
    method_notes: 'Composed per 100 g EDIBLE cooked meat+skin (bone excluded; handle bone loss in default_portion_g). Raw TFDA 棒棒腿(肉雞) I0404302
      = 159 kcal (n=2) and 骨腿(肉雞) I0404102 = 196 (n=1); mean 178 (P 15.6, F 12.3). Cooked yield assumed 0.75 (roast/braise water loss): 178/0.75
      = ~237, set to 232 so it matches the re-summed macros (P 20.8, F 16.4, C 0.6). Excludes deep-fry oil uptake and breading (oil.yaml adder;
      breaded leg is higher). Min 185 ~ braised/lean; max 285 ~ crisp skin-on fried. Yield is an assumption.'
    source:
    - TFDA I0404102
    - TFDA I0404302
    - cook-yield assumption 0.75
    confidence: low
  pork_chop:
    zh: 排骨
    en: Pork chop (fried)
