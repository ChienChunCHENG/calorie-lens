      g = ~600-650 kcal per bowl, consistent with commonly cited 600-700 kcal bowls. Min/max combine component ranges with fully correlated weights.'
    source:
    - TFDA R2000901
    - TFDA I03214 豬骨湯平均值
    - TFDA I0108301
    - composition assumptions
